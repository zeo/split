name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.actor == 'zeo'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ vars.ROT_INSTALLER_REPOSITORY }}
          ref: ${{ vars.ROT_INSTALLER_REF }}
          path: .rot-installer
          ssh-key: ${{ secrets.ROT_INSTALLER_DEPLOY_KEY }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - name: Check the tag matches the package version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $declared = (Select-String -Path split/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($declared -ne $version) { throw "tag $version does not match split/__init__.py $declared" }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) { throw "CHANGELOG.md has no $version entry" }

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          $rest = $lines | Select-Object -Skip $start
          $next = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1)
          $body = if ($next) { $rest | Select-Object -First ($next.LineNumber - 1) } else { $rest }
          ($body | Out-String).Trim() | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'notes.md')

      - name: Build installer tools
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path .rot-installer\Cargo.toml --bin rot-installer --bin rot-pack
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Build Split
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Package for the rot installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SPLIT_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SPLIT_SIGNING_KEY_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $pack = '.rot-installer\target\release\rot-pack.exe'
          function Invoke-Pack { & $pack @args; if ($LASTEXITCODE -ne 0) { throw "rot-pack $($args[0]) failed" } }
          Remove-Item -Recurse -Force build\venv
          New-Item -ItemType Directory -Force release | Out-Null
          $package = "release\split-$version-windows-x86_64.rpack"
          Invoke-Pack pack dist\Split $package --app split --version $version
          Remove-Item -Recurse -Force dist\Split
          Invoke-Pack sign $package "$package.minisig"
          $parts = & $pack parts $package
          if ($LASTEXITCODE -ne 0) { throw "rot-pack parts failed" }
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          $partArgs = foreach ($part in $parts) { '--part-url'; "$base/$(Split-Path $part -Leaf)" }
          $notes = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'notes.md')
          Invoke-Pack manifest $package release\installer.json @partArgs --signature "$package.minisig" `
            --published-at ([DateTime]::UtcNow.ToString('o')) --target windows-x86_64 --notes $notes
          Invoke-Pack sign release\installer.json release\installer.json.minisig
          Invoke-Pack online .rot-installer\target\release\rot-installer.exe "release\split-$version-online-setup.exe"
          Remove-Item $package

      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assets = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME --draft --title "Split $version" --notes-file (Join-Path $env:RUNNER_TEMP 'notes.md') @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
